<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="LUMEN — La última luciérnaga">
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#0a1830"/>
      <stop offset="55%" stop-color="#050a18"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bffcff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#7ef9ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7ef9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe6a8" stop-opacity="1"/>
      <stop offset="45%" stop-color="#ffd166" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6ffff"/>
      <stop offset="100%" stop-color="#9ff4ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#sky)"/>

  <!-- estrellas -->
  <g fill="#c9f3ff">
    <circle cx="120" cy="80" r="1.4" opacity=".55"/>
    <circle cx="240" cy="140" r="1" opacity=".35"/>
    <circle cx="360" cy="60" r="1.6" opacity=".5"/>
    <circle cx="520" cy="100" r="1" opacity=".3"/>
    <circle cx="700" cy="55" r="1.3" opacity=".45"/>
    <circle cx="880" cy="120" r="1" opacity=".35"/>
    <circle cx="1040" cy="70" r="1.5" opacity=".5"/>
    <circle cx="1120" cy="170" r="1" opacity=".3"/>
    <circle cx="60" cy="220" r="1.2" opacity=".35"/>
    <circle cx="960" cy="200" r="1" opacity=".3"/>
  </g>

  <!-- jardín -->
  <path d="M0 430 Q 200 390 420 425 T 1200 415 L1200 500 L0 500 Z" fill="#040910"/>
  <path d="M0 460 Q 320 420 640 452 T 1200 445 L1200 500 L0 500 Z" fill="#02060c"/>

  <g stroke="#123039" stroke-width="2" opacity=".8">
    <path d="M90 500 Q 100 420 130 380" fill="none"/>
    <path d="M1110 500 Q 1090 430 1060 390" fill="none"/>
    <path d="M180 500 Q 175 460 160 440" fill="none"/>
    <path d="M1010 500 Q 1025 450 1040 435" fill="none"/>
  </g>

  <!-- luciérnaga -->
  <g transform="translate(930 230)">
    <circle r="120" fill="url(#halo)" opacity=".55" filter="url(#soft2)"/>
    <circle r="70" fill="url(#halo)" opacity=".75" filter="url(#soft)"/>
    <ellipse cx="-10" cy="-20" rx="16" ry="30" fill="#bffcff" opacity=".25" transform="rotate(-25)"/>
    <ellipse cx="-10" cy="20" rx="16" ry="30" fill="#bffcff" opacity=".25" transform="rotate(25)"/>
    <circle cx="0" cy="0" r="13" fill="#ffffff"/>
    <circle cx="-17" cy="0" r="9" fill="#ffd166"/>
    <circle cx="-17" cy="0" r="20" fill="url(#warm)" opacity=".8" filter="url(#soft)"/>
  </g>

  <!-- texto -->
  <text x="90" y="205" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="118" font-weight="700" letter-spacing="18" fill="url(#title)" filter="url(#soft)">LUMEN</text>
  <text x="94" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="118" font-weight="700" letter-spacing="18" fill="url(#title)">LUMEN</text>

  <text x="96" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="8" fill="#9dffcb">LA ÚLTIMA LUCIÉRNAGA</text>

  <text x="96" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="3" fill="#6f8a9b">JUEGO WEB INDIE · HTML5 CANVAS + WEB AUDIO</text>
  <text x="96" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="3" fill="#6f8a9b">DIEGO ALEJANDRO FRANCO PARTIDA</text>
</svg>
